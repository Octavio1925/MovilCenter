<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tienda de Celulares</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<header class="header">
  <h1>MovilCenter</h1>
  <nav>
    <a href="index.html">Inicio</a>
    <a href="html/carrito.html">Carrito</a>
  </nav>
</header>

<main class="container">

  <h2>Catálogo</h2>

  <div class="grid">

    <div class="card">
      <img src="img/iphone13.jpg" alt="">
      <h3>iPhone 13</h3>
      <p>C$25,000</p>

      <div class="card-buttons">
        <a href="html/producto.html?producto=iphone13" class="btn info">Ver info</a>
        <button onclick="agregarAlCarrito('iPhone 13', 25000)">Agregar</button>
      </div>
    </div>

    <div class="card">
      <img src="img/samsungS22.jpg" alt="">
      <h3>Samsung S22</h3>
      <p>C$20,000</p>

      <div class="card-buttons">
        <a href="html/producto.html?producto=samsungS22" class="btn info">Ver info</a>
        <button onclick="agregarAlCarrito('Samsung S22', 20000)">Agregar</button>
      </div>
    </div>

    <div class="card">
      <img src="img/xiaomi12.jpg" alt="">
      <h3>Xiaomi 12</h3>
      <p>C$15,000</p>

      <div class="card-buttons">
        <a href="html/producto.html?producto=xiaomi12" class="btn info">Ver info</a>
        <button onclick="agregarAlCarrito('Xiaomi 12', 15000)">Agregar</button>
      </div>
    </div>

    <div class="card">
      <img src="img/iphone14.jpg" alt="">
      <h3>iPhone 14</h3>
      <p>C$28,000</p>

      <div class="card-buttons">
        <a href="html/producto.html?producto=iphone14" class="btn info">Ver info</a>
        <button onclick="agregarAlCarrito('iPhone 14', 28000)">Agregar</button>
      </div>
    </div>

    <div class="card">
      <img src="img/samsungA53.jpg" alt="">
      <h3>Samsung A53</h3>
      <p>C$12,000</p>

      <div class="card-buttons">
        <a href="html/producto.html?producto=samsungA53" class="btn info">Ver info</a>
        <button onclick="agregarAlCarrito('Samsung A53', 12000)">Agregar</button>
      </div>
    </div>

    <div class="card">
      <img src="img/redmiNote11.jpg" alt="">
      <h3>Redmi Note 11</h3>
      <p>C$9,000</p>

      <div class="card-buttons">
        <a href="html/producto.html?producto=redmiNote11" class="btn info">Ver info</a>
        <button onclick="agregarAlCarrito('Redmi Note 11', 9000)">Agregar</button>
      </div>
    </div>

  </div>

</main>

<script src="js/carrito.js"></script>

</html>
